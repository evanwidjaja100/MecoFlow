name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          config-file: ./.github/dependency-review-config.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: ci
      APP_VERSION: 0.1.0
      CORS_ORIGINS: http://127.0.0.1:3000
      DATABASE_URL: postgresql://mecoflow:mecoflow@localhost:5432/mecoflow?schema=public
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      OIDC_ISSUER: http://127.0.0.1:8180/realms/mecoflow-local
      OIDC_REDIRECT_URI: http://127.0.0.1:3001/api/v1/auth/callback
      REDIS_URL: redis://localhost:6379
      S3_ACCESS_KEY: mecoflow
      S3_BUCKET: mecoflow-private
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_SECRET_KEY: mecoflow-local-ci
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      WEB_BASE_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mecoflow
          POSTGRES_PASSWORD: mecoflow
          POSTGRES_USER: mecoflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mecoflow -d mecoflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm verify
      - run: pnpm test:authorization
      - run: pnpm openapi:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm security:audit
      - run: pnpm production:preflight:test
      - run: pnpm operations:preflight:test
      - run: pnpm capacity:test
      - name: Validate Compose
        run: cp .env.example .env && docker compose config --quiet
      - name: Build application containers
        run: |
          docker build -f apps/api/Dockerfile -t mecoflow-api:ci .
          docker build -f apps/worker/Dockerfile -t mecoflow-worker:ci .
          docker build -f apps/web/Dockerfile -t mecoflow-web:ci .

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test container scan policy
        run: node --test scripts/container-scan-policy.test.mjs
      - name: Build every project-owned release image
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BUILD_ARGS=(--build-arg APP_VERSION="$APP_VERSION" --build-arg BUILD_DATE="$BUILD_DATE" --build-arg VCS_REF="$GITHUB_SHA")
          docker build "${BUILD_ARGS[@]}" -f apps/api/Dockerfile -t "mecoflow/api:$APP_VERSION" .
          docker build "${BUILD_ARGS[@]}" -f apps/worker/Dockerfile -t "mecoflow/worker:$APP_VERSION" .
          docker build "${BUILD_ARGS[@]}" --build-arg NEXT_PUBLIC_API_BASE_URL=https://mecoflow.invalid -f apps/web/Dockerfile -t "mecoflow/web:$APP_VERSION" .
          docker build "${BUILD_ARGS[@]}" -f infra/docker/migrations.Dockerfile -t "mecoflow/migrations:$APP_VERSION" .
          docker build "${BUILD_ARGS[@]}" -f infra/docker/operations.Dockerfile -t "mecoflow/operations:$APP_VERSION" .
          docker build "${BUILD_ARGS[@]}" -f infra/docker/minio.Dockerfile -t "mecoflow/minio:$APP_VERSION" .
          docker build "${BUILD_ARGS[@]}" -f infra/docker/clamav.Dockerfile -t "mecoflow/clamav:$APP_VERSION" .
          docker build "${BUILD_ARGS[@]}" -f infra/docker/postgres.Dockerfile -t "mecoflow/postgres:$APP_VERSION" .
          docker build "${BUILD_ARGS[@]}" -f infra/docker/proxy.Dockerfile -t "mecoflow/proxy:$APP_VERSION" .
          docker pull redis:8.2-alpine
          docker pull quay.io/keycloak/keycloak:26.7.0
          docker pull prom/prometheus:v3.12.0-busybox
          docker pull prom/alertmanager:v0.32.1
          docker pull prom/blackbox-exporter:v0.28.0
      - name: Validate monitoring configuration
        run: node scripts/validate-monitoring-config.mjs
      - name: Scan every release image
        run: node scripts/scan-container-images.mjs
