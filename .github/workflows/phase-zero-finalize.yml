name: Phase Zero Finalization

on:
  workflow_dispatch:
    inputs:
      closure_sha:
        description: Full final closure commit SHA on main
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  phase-zero-finalization:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.PHASE_ZERO_READ_TOKEN }}
      PHASE_ZERO_DISPATCH_CANDIDATE_SHA: ${{ inputs.closure_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Validate finalization trigger
        run: node scripts/verify-ci-trigger-context.mjs
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify local and authenticated external Phase 0 closure
        run: pnpm phase0:closure
