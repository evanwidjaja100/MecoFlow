global:
  resolve_timeout: 5m

route:
  receiver: production-oncall
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - receiver: production-oncall
      matchers: ['severity="critical"']
      repeat_interval: 30m

receivers:
  - name: production-oncall
    webhook_configs:
      - url_file: /run/secrets/oncall_webhook_url
        send_resolved: true
        max_alerts: 20
        timeout: 10s
