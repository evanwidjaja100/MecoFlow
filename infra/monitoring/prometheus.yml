global:
  evaluation_interval: 15s
  scrape_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/recording-rules.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mecoflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3001"]

  - job_name: mecoflow-keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  - job_name: mecoflow-public-https
    metrics_path: /probe
    params:
      module: [mecoflow_https_2xx]
    static_configs:
      - targets:
          - https://mecoflow.localhost:8443/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - replacement: blackbox:9115
        target_label: __address__
