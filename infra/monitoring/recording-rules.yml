groups:
  - name: mecoflow-recording
    interval: 30s
    rules:
      - record: mecoflow:http_requests:rate5m
        expr: sum by (method, route, status_class) (rate(mecoflow_http_requests_total[5m]))
      - record: mecoflow:http_requests:error_ratio5m
        expr: sum(rate(mecoflow_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(mecoflow_http_requests_total[5m])), 0.001)
      - record: mecoflow:http_request_duration:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(mecoflow_http_request_duration_seconds_bucket[5m])))
      - record: mecoflow:http_request_duration:p99_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(mecoflow_http_request_duration_seconds_bucket[5m])))
      - record: mecoflow:outbox:pending_total
        expr: sum(mecoflow_outbox_events{status="PENDING"})
      - record: mecoflow:outbox:terminal_failure_total
        expr: sum(mecoflow_outbox_events{status=~"FAILED|DEAD_LETTER"})
